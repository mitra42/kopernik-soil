; kopernik_soil - PlatformIO build. Arduino IDE users: ignore this file, see kopernik_soil.ino
[platformio]
src_dir = .
default_envs = d1_mini
; Any *-local.ini here is loaded on top of this file, and is where the enrolment secret goes - a
; platformio-secrets-local.ini defining build_flags_secrets, as the library's examples use.
; Without one the node is refused and listed on the dashboard's Nodes card for approval.
extra_configs = *-local.ini

[common]
build_flags_secrets =
; The same settings as platform.h, less the per-board OTA suffix
build_flags =
    ${common.build_flags_secrets}
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    '-D SYSTEM_OTA_PREFIX="kopernik_soil"'
    -D CONTROL_HTTPPOST_DEBUG              ; Uncomment to print every post
    -D SENSOR_SOIL_DEBUG                   ; Uncomment to debug SOIL readings
    -D SYSTEM_WIFI_DEBUG                   ; Uncomment to debug WIFI connection attempts
    -D SYSTEM_MQTT_DEBUG                   ; Uncomment to debug MQTT interactions

[env]
framework = arduino
monitor_speed = 460800
upload_speed = 460800
board_build.filesystem = littlefs
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    ; The library checkout, while Control_HttpPost and Sensor_Analog::takeMedian() are unreleased
    ; symlink:///Users/mitra/Documents/Arduino/frugal-iot-demo/lib/Frugal-IoT ; use a local copy of library
    ; https://github.com/mitra42/frugal-iot.git ; Most recent push
    Frugal-IoT@^2.0.13 ; The released library

[env:d1_mini]
platform = espressif8266
board = d1_mini ; defines ARDUINO_ESP8266_WEMOS_D1MINI, as the Arduino IDE does
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="d1_mini"'

[env:supermini] ; ESP32-C3 SuperMini, and the SuperMini Pro
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini ; defines only ARDUINO_ESP32C3_DEV, hence SUPERMINI below
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -D SUPERMINI ; The Arduino IDE's ARDUINO_NOLOGO_ESP32C3_SUPER_MINI, for the #if in the sketch
    '-D SYSTEM_OTA_SUFFIX="supermini"'
